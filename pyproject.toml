[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-churn-intelligence"
version = "0.1.0"
description = "Telecom customer churn analytics, model comparison, and retention scoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.1",
  "mlflow>=2.10",
]

[project.scripts]
telco-churn = "telco_churn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

